; PlatformIO project configuration for the ESU-TAP v3 (four-channel) firmware.
;
; Target: ESP32-DEVKITC-32E, micro-ROS over wired USB serial to a ROS 2 Humble
; PC running the micro-ROS agent.
;
; NOTE ON LIBRARIES: this project uses micro_ros_platformio, NOT
; micro_ros_arduino. They are different libraries with different transport
; APIs. micro_ros_arduino uses set_microros_transports(); this one requires
; Serial.begin() followed by set_microros_serial_transports(Serial). Do not
; mix them.
;
; First build is SLOW (several minutes) -- micro_ros_platformio compiles the
; micro-ROS stack from source. Later builds are incremental and fast.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Must match the agent's -b argument and the Serial.begin() in setup().
monitor_speed = 115200
upload_speed = 921600

; Bind uploads/monitor to a stable udev symlink for the ESP32 rather than the
; volatile /dev/ttyUSBn. Create the rule on the host so this always points at
; the right device. Adjust the symlink name to your environment.
upload_port = /dev/esp32-esu
monitor_port = /dev/esp32-esu

; micro-ROS build configuration, consumed by micro_ros_platformio.
board_microros_distro = humble
board_microros_transport = serial

; Raises the static entity limits. v3 hosts FOUR services
; (/esu/cut, /esu/coag, /esu/bipolar, /esu/ligasure) plus one publisher, so
; RMW_UXRCE_MAX_SERVICES must be >= 4. The checked-in colcon.meta uses 5.
;
; After changing colcon.meta you MUST rebuild the micro-ROS library:
;   pio run -t clean_microros
board_microros_user_meta = colcon.meta

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
