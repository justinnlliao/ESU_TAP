; One shared implementation; explicitly select the PCB, not just the ESP32.
[platformio]
default_envs = v1, v2, v3
extra_configs = common.ini

[env:v1]
build_flags = -DESU_BOARD_VERSION=1
board_microros_user_meta = colcon.meta
extra_scripts = pre:check_upload.py

[env:v2]
build_flags = -DESU_BOARD_VERSION=2
board_microros_user_meta = colcon.meta
extra_scripts = pre:check_upload.py

[env:v3]
build_flags = -DESU_BOARD_VERSION=3
board_microros_user_meta = colcon.meta
extra_scripts = pre:check_upload.py
